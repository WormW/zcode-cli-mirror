name: Sync upstream and build ZCode CLI

# 定时同步上游 zai-org/ZCode 的 main 分支，构建官方 Agent CLI，
# 打成 tarball 发到本仓库 Releases，并同步发布到 npm。
# 上游代码零修改，npm package.json 仅在构建产物中生成。

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 02:00 UTC = 10:00 北京
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref to build (branch / tag / sha). 留空则同步 main。'
        required: false
        default: ''
      skip_npm:
        description: '仅发布 GitHub Release，不发布 npm'
        type: boolean
        required: false
        default: false
      verify_npm:
        description: '只验证已接受的 npm 版本，不构建、不重新 publish（格式 latest 或 0.0.0-nightly...）'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write       # npm provenance / Sigstore

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    if: inputs.verify_npm == ''
    env:
      NPM_PACKAGE: '@wormw/zcode-cli'
      NPM_REGISTRY: 'https://registry.npmjs.org'
      NPM_REGISTRY_HOST: 'registry.npmjs.org'
      ZCODE_DATA_BASE_DIR: ${{ runner.temp }}/zcode-smoke-data
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/zai-org/ZCode.git
          git fetch upstream --tags

      - name: Resolve target ref
        id: target
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="upstream/main"
          fi
          SHA=$(git rev-parse "$REF")
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # 如果 sha 恰好是某个 tag，用 tag 名做版本号；否则用短 sha
          TAG=$(git tag --points-at "$SHA" | grep -E '^v[0-9]' | sort -V | tail -1 || true)
          if [ -n "$TAG" ]; then
            # 同一上游代码的打包修复递增镜像修订号，不覆盖不可变 npm 版本。
            PACKAGE_REVISION=1
            while gh release view "${TAG}-mirror.${PACKAGE_REVISION}" --repo "${{ github.repository }}" >/dev/null 2>&1; do
              PACKAGE_REVISION=$((PACKAGE_REVISION + 1))
            done
            VERSION="${TAG}-mirror.${PACKAGE_REVISION}"
            NPM_VERSION="${TAG#v}-mirror.${PACKAGE_REVISION}"
            NPM_CHANNEL="latest"
          else
            VERSION="nightly-$(date -u +%Y%m%d%H%M%S)-${SHA:0:7}"
            NPM_VERSION="0.0.0-nightly.$(date -u +%Y%m%d%H%M%S).${SHA:0:7}"
            NPM_CHANNEL="nightly"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_channel=$NPM_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Building $REF ($SHA) as $VERSION; npm $NPM_PACKAGE@$NPM_VERSION ($NPM_CHANNEL)"

      - name: Skip if release already exists
        id: skip
        run: |
          if gh release view "${{ steps.target.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.target.outputs.version }} was concurrently created; stopping." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main to upstream
        if: inputs.ref == ''
        run: |
          git config user.name "zcode-mirror-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout main
          git merge --ff-only upstream/main
          git push origin main

      - name: Checkout exact upstream sha for build

        run: |
          # 构建开始前保存 fork 的镜像文档；上游 commit 不包含此文件。
          cp MIRROR.md "$RUNNER_TEMP/zcode-mirror-README.md"
          git checkout "${{ steps.target.outputs.sha }}"

      - name: Setup mise (locks Node 24.14.0 + pnpm 10.33.2 per upstream mise.toml)

        uses: jdx/mise-action@v2

      - name: Install dependencies (frozen lockfile)

        run: pnpm install --frozen-lockfile

      - name: Build Agent CLI and its workspace deps

        run: pnpm --filter @zcode/cli... build

      - name: Assemble official CLI distribution

        run: |
          # 上游官方组装入口：包含 Agent、TUI 原生库、workers 和运行时依赖。
          # 本地占位 URL 仅用于生成安装索引，不会用于 npm 或本 Release 安装。
          pnpm build:zcode --base-url https://zcode-mirror.invalid/releases/
          node -e 'const p=require("./dist/zcode/zcode/package.json"); if(p.name!=="zcode-runtime")process.exit(1)'

      - name: Package official distribution for npm and Releases

        id: pack
        run: |
          set -e
          rm -rf stage/zcode
          mkdir -p stage
          cp -r dist/zcode/zcode stage/zcode
          STAGE="$PWD/stage/zcode"
          # 不改上游 runner；npm 通过无扩展名入口加载它，并保持真实 Agent argv[1]。
          cat > "$STAGE/bin/zcode" <<'EOF'
          #!/usr/bin/env node
          import './zcode.mjs';
          EOF
          chmod +x "$STAGE/bin/zcode"
          node -e '
            const fs = require("fs");
            const file = "stage/zcode/package.json";
            const p = JSON.parse(fs.readFileSync(file));
            Object.assign(p, {
              name: process.env.NPM_PACKAGE,
              version: "${{ steps.target.outputs.npm_version }}",
              private: false,
              description: "Automated, unmodified build of the official ZCode Agent CLI",
              license: "Apache-2.0",
              bin: { zcode: "./bin/zcode" },
              engines: { node: ">=24.14.0" },
              repository: { type: "git", url: "git+https://github.com/${{ github.repository }}.git" },
              publishConfig: { access: "public", registry: process.env.NPM_REGISTRY }
            });
            fs.writeFileSync(file, JSON.stringify(p, null, 2) + "\n");
          '
          mkdir -p "$STAGE/docs"
          cp -r apps/zcode-cli/docs/usage "$STAGE/docs/"
          cp "$RUNNER_TEMP/zcode-mirror-README.md" "$STAGE/README.md"
          if [ -f LICENSE ]; then cp LICENSE "$STAGE/LICENSE"; fi
          cat > "$STAGE/install.sh" <<'EOF'
          #!/usr/bin/env bash
          set -e
          PREFIX="${PREFIX:-$HOME/.local}"
          mkdir -p "$PREFIX/lib" "$PREFIX/bin"
          rm -rf "$PREFIX/lib/zcode"
          cp -R . "$PREFIX/lib/zcode"
          ln -sf ../lib/zcode/bin/zcode "$PREFIX/bin/zcode"
          echo "Installed to $PREFIX. Ensure $PREFIX/bin is on your PATH."
          EOF
          chmod +x "$STAGE/install.sh"
          (cd "$STAGE" && npm pack --dry-run --json) > npm-pack-dry-run.json
          TARBALL="zcode-cli-${{ steps.target.outputs.version }}-node24.tar.gz"
          tar -czf "stage/$TARBALL" -C stage zcode
          (cd stage && shasum -a 256 "$TARBALL" > "$TARBALL.sha256")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Smoke test official distribution outside the repository

        run: |
          # 上游测试包含真实 PTY 的 TUI 初始化渲染和键盘退出，不只测 --version。
          node scripts/zcode-distribution-smoke.mjs "stage/${{ steps.pack.outputs.tarball }}"

      - name: Upload to GitHub Releases

        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.version }}
          name: ZCode CLI ${{ steps.target.outputs.version }}
          body: |
            自动镜像构建自上游 [zai-org/ZCode@${{ steps.target.outputs.sha }}](https://github.com/zai-org/ZCode/commit/${{ steps.target.outputs.sha }}).

            - 源码零修改，仅 `pnpm install --frozen-lockfile` + `pnpm --filter @zcode/cli... build`
            - 运行需要 Node.js >= 24.14.0
            - 包含官方 Agent CLI、TUI 和本地 Web，不含桌面 GUI

            **安装**：
            ```bash
            tar -xzf ${{ steps.pack.outputs.tarball }}
            cd zcode
            ./install.sh          # 默认装到 ~/.local，PREFIX=/usr/local 可改
            zcode --version
            ```

            **校验**：
            ```bash
            shasum -a 256 -c ${{ steps.pack.outputs.tarball }}.sha256
            ```
          files: |
            stage/${{ steps.pack.outputs.tarball }}
            stage/${{ steps.pack.outputs.tarball }}.sha256
          prerelease: ${{ contains(steps.target.outputs.version, 'nightly') }}

      - name: Check npm credentials and version availability
        if: '!inputs.skip_npm'
        id: npm-check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/zcode-npmrc
        run: |
          set -e
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'NPM_TOKEN repository secret is missing or empty.' >&2
            exit 1
          fi
          {
            echo "registry=$NPM_REGISTRY"
            echo "//$NPM_REGISTRY_HOST/:_authToken=\${NODE_AUTH_TOKEN}"
          } > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          npm whoami
          PACKAGE_SPEC="$NPM_PACKAGE@${{ steps.target.outputs.npm_version }}"
          if npm view "$PACKAGE_SPEC" version >/dev/null 2>&1; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_SPEC already exists; publish is not idempotent, so this run must stop." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Publish package to npm with provenance
        if: '!inputs.skip_npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/zcode-npmrc
          NPM_VERSION: ${{ steps.target.outputs.npm_version }}
          NPM_CHANNEL: ${{ steps.target.outputs.npm_channel }}
          UPSTREAM_SHA: ${{ steps.target.outputs.sha }}
        working-directory: stage/zcode
        run: |
          set -e
          npm publish --access public --tag "$NPM_CHANNEL" --provenance
          echo "$NPM_PACKAGE@$NPM_VERSION published with dist-tag $NPM_CHANNEL (upstream $UPSTREAM_SHA)"

      - name: Verify fresh installation from npm
        if: '!inputs.skip_npm'
        env:
          NPM_VERSION: ${{ steps.target.outputs.npm_version }}
          NPM_CHANNEL: ${{ steps.target.outputs.npm_channel }}
        run: |
          set -e
          # npm 现在会异步处理 publish：先等待，避免过早请求产生 CDN 负缓存。
          sleep 120
          for attempt in $(seq 1 26); do
            if npm view "$NPM_PACKAGE@$NPM_VERSION" version >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 26 ]; then echo 'Published version is not visible after 15 minutes.' >&2; exit 1; fi
            sleep 30
          done
          INSTALL_DIR="$RUNNER_TEMP/npm-install-verify"
          mkdir -p "$INSTALL_DIR"
          npm install --global --prefix "$INSTALL_DIR" --ignore-scripts "$NPM_PACKAGE@$NPM_VERSION"
          "$INSTALL_DIR/bin/zcode" --version
          node scripts/verify-installed-tui.mjs "$INSTALL_DIR/bin/zcode"
          npm dist-tag ls "$NPM_PACKAGE"
          npm view "$NPM_PACKAGE@$NPM_VERSION" dist.tarball dist.integrity --json

  verify-npm:
    # 用于 202 Accepted 后的独立可见性检查，绝不重新 publish。
    if: inputs.verify_npm != ''
    runs-on: ubuntu-latest
    env:
      NPM_PACKAGE: '@wormw/zcode-cli'
      NPM_REGISTRY: 'https://registry.npmjs.org'
      ZCODE_DATA_BASE_DIR: ${{ runner.temp }}/zcode-smoke-data
    steps:
      - name: Checkout verification script and PTY runtime
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --no-save node-pty
      - name: Resolve requested version
        id: version
        run: |
          if [ "${{ inputs.verify_npm }}" = 'latest' ]; then
            VERSION=$(npm view "$NPM_PACKAGE@latest" version)
          else
            VERSION="${{ inputs.verify_npm }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for registry and verify fresh installation
        env:
          NPM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          sleep 120
          for attempt in $(seq 1 26); do
            if npm view "$NPM_PACKAGE@$NPM_VERSION" version >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 26 ]; then echo 'Published version is not visible after 15 minutes.' >&2; exit 1; fi
            sleep 30
          done
          INSTALL_DIR="$RUNNER_TEMP/npm-install-verify"
          npm install --global --prefix "$INSTALL_DIR" --ignore-scripts "$NPM_PACKAGE@$NPM_VERSION"
          "$INSTALL_DIR/bin/zcode" --version
          node scripts/verify-installed-tui.mjs "$INSTALL_DIR/bin/zcode"
          npm dist-tag ls "$NPM_PACKAGE"
          npm view "$NPM_PACKAGE@$NPM_VERSION" dist.tarball dist.integrity --json
