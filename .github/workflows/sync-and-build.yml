name: Sync upstream and build ZCode CLI

# 定时同步上游 zai-org/ZCode 的 main 分支，构建官方 Agent CLI，
# 打成 tarball 发到本仓库 Releases，并同步发布到 npm。
# 上游代码零修改，npm package.json 仅在构建产物中生成。

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 02:00 UTC = 10:00 北京
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref to build (branch / tag / sha). 留空则同步 main。'
        required: false
        default: ''
      skip_npm:
        description: '仅发布 GitHub Release，不发布 npm'
        type: boolean
        required: false
        default: false
      repair_npm:
        description: '已有 GitHub Release 时，从该 Release 下载构建产物补发 npm'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write       # npm provenance / Sigstore

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    env:
      NPM_PACKAGE: '@wormw/zcode-cli'
      NPM_REGISTRY: 'https://registry.npmjs.org'
      NPM_REGISTRY_HOST: 'registry.npmjs.org'
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/zai-org/ZCode.git
          git fetch upstream --tags

      - name: Resolve target ref
        id: target
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="upstream/main"
          fi
          SHA=$(git rev-parse "$REF")
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # 如果 sha 恰好是某个 tag，用 tag 名做版本号；否则用短 sha
          TAG=$(git tag --points-at "$SHA" | grep -E '^v[0-9]' | head -1 || true)
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION="nightly-$(date -u +%Y%m%d)-${SHA:0:7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # npm 使用合法 semver。正式版发 latest，每日 main 构建发 nightly。
          if [ -n "$TAG" ]; then
            NPM_VERSION="${TAG#v}"
            NPM_CHANNEL="latest"
          else
            NPM_VERSION="0.0.0-nightly.$(date -u +%Y%m%d%H%M%S).${SHA:0:7}"
            NPM_CHANNEL="nightly"
          fi
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_channel=$NPM_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Building $REF ($SHA) as $VERSION; npm $NPM_PACKAGE@$NPM_VERSION ($NPM_CHANNEL)"

      - name: Skip if release already exists
        id: skip
        run: |
          if gh release view "${{ steps.target.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ inputs.repair_npm }}" = 'true' ]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "repair=true" >> "$GITHUB_OUTPUT"
              echo "Existing release: recovering its artifact for npm publishing."
            else
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Release ${{ steps.target.outputs.version }} already exists, skipping build."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main to upstream
        if: steps.skip.outputs.exists == 'false' && inputs.ref == ''
        run: |
          git config user.name "zcode-mirror-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout main
          git merge --ff-only upstream/main
          git push origin main

      - name: Checkout exact upstream sha for build
        if: steps.skip.outputs.exists == 'false'
        run: |
          # 构建开始前保存 fork 的镜像文档；上游 commit 不包含此文件。
          cp MIRROR.md "$RUNNER_TEMP/zcode-mirror-README.md"
          git checkout "${{ steps.target.outputs.sha }}"

      - name: Setup mise (locks Node 24.14.0 + pnpm 10.33.2 per upstream mise.toml)
        if: steps.skip.outputs.exists == 'false'
        uses: jdx/mise-action@v2

      - name: Install dependencies (frozen lockfile)
        if: steps.skip.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Build Agent CLI and its workspace deps
        if: steps.skip.outputs.exists == 'false'
        run: pnpm --filter @zcode/cli... build

      - name: Package CLI artifact
        if: steps.skip.outputs.exists == 'false'
        id: pack
        run: |
          set -e
          STAGE="stage/zcode"
          mkdir -p "$STAGE"
          # 整个 dist/ 打包（zcode.cjs 入口 + 相邻 runtime 资源）
          cp -r apps/zcode-cli/packages/cli/dist "$STAGE/dist"
          # 附带 npm 发布用 package.json。上游源码保持 private:true，不修改。
          cat > "$STAGE/package.json" <<EOF
          {
            "name": "$NPM_PACKAGE",
            "version": "${{ steps.target.outputs.npm_version }}",
            "description": "Automated, unmodified build of the official ZCode Agent CLI",
            "license": "Apache-2.0",
            "type": "module",
            "main": "./dist/zcode.cjs",
            "bin": { "zcode": "./bin/zcode" },
            "files": ["bin", "dist", "docs", "install.sh"],
            "engines": { "node": ">=24.14.0" },
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "homepage": "https://github.com/${{ github.repository }}#readme",
            "publishConfig": {
              "access": "public",
              "registry": "$NPM_REGISTRY"
            }
          }
          EOF
          # 使用无扩展名的 Node 转发入口，兼容 npm 11 的 bin 校验。
          mkdir -p "$STAGE/bin"
          cat > "$STAGE/bin/zcode" <<'EOF'
          #!/usr/bin/env node
          import '../dist/zcode.cjs';
          EOF
          chmod +x "$STAGE/bin/zcode"
          # 附带 CLI 文档
          mkdir -p "$STAGE/docs"
          cp -r apps/zcode-cli/docs/usage "$STAGE/docs/" || true
          # 安装脚本：把 dist 放到 lib，bin/zcode 转发
          cat > "$STAGE/install.sh" <<'EOF'
          #!/usr/bin/env bash
          set -e
          PREFIX="${PREFIX:-$HOME/.local}"
          mkdir -p "$PREFIX/lib/zcode" "$PREFIX/bin"
          cp -r dist bin package.json docs "$PREFIX/lib/zcode/"
          cat > "$PREFIX/bin/zcode" <<LAUNCH
          #!/usr/bin/env bash
          exec node "$PREFIX/lib/zcode/dist/zcode.cjs" "\$@"
          LAUNCH
          chmod +x "$PREFIX/bin/zcode"
          echo "Installed to $PREFIX. Ensure $PREFIX/bin is on your PATH."
          EOF
          chmod +x "$STAGE/install.sh"

          # npm 文档只存在于构建产物，不改上游 README。
          cp "$RUNNER_TEMP/zcode-mirror-README.md" "$STAGE/README.md"
          if [ -f LICENSE ]; then cp LICENSE "$STAGE/LICENSE"; fi

          # 在真正 publish 前验证 npm tarball 内容及可执行入口。
          node -e 'const p=require("./stage/zcode/package.json"); if(p.private || !p.bin?.zcode) process.exit(1)'
          (cd "$STAGE" && npm pack --dry-run --json) > npm-pack-dry-run.json

          cd stage
          TARBALL="zcode-cli-${{ steps.target.outputs.version }}-node24.tar.gz"
          tar -czf "$TARBALL" zcode
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          ls -la

      - name: Smoke test the artifact
        if: steps.skip.outputs.exists == 'false'
        run: |
          node stage/zcode/dist/zcode.cjs --version
          node stage/zcode/dist/zcode.cjs --help | head -30

      - name: Recover verified Release artifact for npm repair
        if: steps.skip.outputs.repair == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p release-artifact
          gh release download "${{ steps.target.outputs.version }}" --repo "${{ github.repository }}" --dir release-artifact
          (cd release-artifact && shasum -a 256 -c *.sha256)
          tar -xzf release-artifact/zcode-cli-*-node24.tar.gz -C release-artifact
          mkdir -p stage
          mv release-artifact/zcode stage/zcode
          # 兼容在 bin 转发入口修复前创建的 Release 产物。
          if [ ! -f stage/zcode/bin/zcode ]; then
            mkdir -p stage/zcode/bin
            printf "#!/usr/bin/env node\nimport '../dist/zcode.cjs';\n" > stage/zcode/bin/zcode
            chmod +x stage/zcode/bin/zcode
            node -e 'const fs=require("fs"); const p="stage/zcode/package.json"; const j=JSON.parse(fs.readFileSync(p)); j.bin={zcode:"./bin/zcode"}; j.files=["bin",...j.files.filter(f=>f!=="bin")]; fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
          fi
          stage/zcode/bin/zcode --version

      - name: Upload to GitHub Releases
        if: steps.skip.outputs.exists == 'false' && steps.skip.outputs.repair != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.version }}
          name: ZCode CLI ${{ steps.target.outputs.version }}
          body: |
            自动镜像构建自上游 [zai-org/ZCode@${{ steps.target.outputs.sha }}](https://github.com/zai-org/ZCode/commit/${{ steps.target.outputs.sha }}).

            - 源码零修改，仅 `pnpm install --frozen-lockfile` + `pnpm --filter @zcode/cli... build`
            - 运行需要 Node.js >= 24.14.0
            - 仅包含 Agent CLI（`zcode` 命令），不含桌面 GUI、不含 `--web` 模式

            **安装**：
            ```bash
            tar -xzf ${{ steps.pack.outputs.tarball }}
            cd zcode
            ./install.sh          # 默认装到 ~/.local，PREFIX=/usr/local 可改
            zcode --version
            ```

            **校验**：
            ```bash
            shasum -a 256 -c ${{ steps.pack.outputs.tarball }}.sha256
            ```
          files: |
            stage/${{ steps.pack.outputs.tarball }}
            stage/${{ steps.pack.outputs.tarball }}.sha256
          prerelease: ${{ contains(steps.target.outputs.version, 'nightly') }}

      - name: Check npm credentials and version availability
        if: steps.skip.outputs.exists == 'false' && !inputs.skip_npm
        id: npm-check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/zcode-npmrc
        run: |
          set -e
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'NPM_TOKEN repository secret is missing or empty.' >&2
            exit 1
          fi
          {
            echo "registry=$NPM_REGISTRY"
            echo "//$NPM_REGISTRY_HOST/:_authToken=\${NODE_AUTH_TOKEN}"
          } > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          npm whoami
          PACKAGE_SPEC="$NPM_PACKAGE@${{ steps.target.outputs.npm_version }}"
          if npm view "$PACKAGE_SPEC" version >/dev/null 2>&1; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_SPEC already exists; publish is not idempotent, so this run must stop." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Publish package to npm with provenance
        if: steps.skip.outputs.exists == 'false' && !inputs.skip_npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/zcode-npmrc
          NPM_VERSION: ${{ steps.target.outputs.npm_version }}
          NPM_CHANNEL: ${{ steps.target.outputs.npm_channel }}
          UPSTREAM_SHA: ${{ steps.target.outputs.sha }}
        working-directory: stage/zcode
        run: |
          set -e
          npm publish --access public --tag "$NPM_CHANNEL" --provenance
          echo "$NPM_PACKAGE@$NPM_VERSION published with dist-tag $NPM_CHANNEL (upstream $UPSTREAM_SHA)"

      - name: Verify fresh installation from npm
        if: steps.skip.outputs.exists == 'false' && !inputs.skip_npm
        env:
          NPM_VERSION: ${{ steps.target.outputs.npm_version }}
          NPM_CHANNEL: ${{ steps.target.outputs.npm_channel }}
        run: |
          set -e
          # registry 写入可能有短暂延迟，按 npm view 可见性重试。
          for attempt in 1 2 3 4 5 6; do
            if npm view "$NPM_PACKAGE@$NPM_VERSION" version >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 6 ]; then echo 'Published version is not visible after retries.' >&2; exit 1; fi
            sleep 5
          done
          INSTALL_DIR="$RUNNER_TEMP/npm-install-verify"
          mkdir -p "$INSTALL_DIR"
          npm install --global --prefix "$INSTALL_DIR" --ignore-scripts "$NPM_PACKAGE@$NPM_VERSION"
          "$INSTALL_DIR/bin/zcode" --version
          npm dist-tag ls "$NPM_PACKAGE"
          npm view "$NPM_PACKAGE@$NPM_VERSION" dist.tarball dist.integrity --json
