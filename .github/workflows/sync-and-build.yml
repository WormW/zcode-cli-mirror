name: Sync upstream and build ZCode CLI

# 分别检出镜像配置和上游源码，构建 CLI-only 产物并发布到 Releases/npm。
# 不修改或推送上游源码，也不向镜像 main 自动合并上游提交。

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to build (branch / tag / sha). 留空则构建 main。"
        required: false
        default: ""
      skip_npm:
        description: "仅发布 GitHub Release，不发布 npm"
        type: boolean
        required: false
        default: false
      verify_npm:
        description: "只验证已发布 npm 版本或 latest/nightly，不构建、不重新 publish"
        required: false
        default: ""

env:
  NPM_PACKAGE: "@wormw/zcode-cli"
  NPM_REGISTRY: "https://registry.npmjs.org"
  NPM_REGISTRY_HOST: "registry.npmjs.org"

concurrency:
  group: zcode-cli-release
  cancel-in-progress: false

jobs:
  sync-and-build:
    if: ${{ github.event_name == 'schedule' || inputs.verify_npm == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout mirror release helpers
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact upstream source
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ inputs.ref }}
          path: upstream-src
          fetch-depth: 0

      - name: Resolve target and allocate an immutable version
        id: target
        working-directory: upstream-src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_REPOSITORY: ${{ github.repository }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -e
          SHA=$(git rev-parse HEAD)
          NODE_VERSION=$(sed -n 's/^node = "\([^"]*\)"/\1/p' mise.toml | head -1)
          test -n "$NODE_VERSION"
          TAG=""
          if [ -n "$REQUESTED_REF" ] && [ "$REQUESTED_REF" != "main" ]; then
            TAG=$(git tag --points-at "$SHA" | grep -E '^v[0-9]' | sort -V | tail -1 || true)
          fi
          if [ -n "$TAG" ]; then
            PACKAGE_REVISION=1
            while true; do
              RELEASE_TAG="${TAG}-mirror.${PACKAGE_REVISION}"
              NPM_CANDIDATE="${TAG#v}-mirror.${PACKAGE_REVISION}"
              if ! gh release view "$RELEASE_TAG" --repo "$MIRROR_REPOSITORY" >/dev/null 2>&1 \
                && ! npm view "$NPM_PACKAGE@$NPM_CANDIDATE" version >/dev/null 2>&1; then
                break
              fi
              PACKAGE_REVISION=$((PACKAGE_REVISION + 1))
            done
            VERSION="$RELEASE_TAG"
            NPM_VERSION="$NPM_CANDIDATE"
            NPM_CHANNEL="latest"
          else
            TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
            VERSION="nightly-${TIMESTAMP}-${SHA:0:7}"
            NPM_VERSION="0.0.0-nightly.${TIMESTAMP}.${SHA:0:7}"
            NPM_CHANNEL="nightly"
          fi
          {
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "npm_version=$NPM_VERSION"
            echo "npm_channel=$NPM_CHANNEL"
            echo "node_major=${NODE_VERSION%%.*}"
          } >> "$GITHUB_OUTPUT"
          echo "Building $SHA as $VERSION; npm $NPM_PACKAGE@$NPM_VERSION ($NPM_CHANNEL)"

      - name: Merge the exact upstream SHA into mirror main
        if: ${{ github.event_name == 'schedule' || inputs.ref == '' }}
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -e
          git config user.name "zcode-mirror-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/zai-org/ZCode.git
          git fetch upstream "$TARGET_SHA"
          git checkout -B main origin/main
          git merge --no-ff "$TARGET_SHA" -m "Merge upstream ${TARGET_SHA:0:12}"
          git push origin main

      - name: Setup upstream Node.js and pnpm
        uses: jdx/mise-action@v2
        with:
          working_directory: upstream-src

      - name: Test mirror release helpers
        run: node --test scripts/test/cli-mirror-release.test.mjs

      - name: Check npm credentials and version availability
        if: '!inputs.skip_npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/zcode-npmrc
          NPM_VERSION: ${{ steps.target.outputs.npm_version }}
        run: |
          set -e
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is missing or empty." >&2
            exit 1
          fi
          {
            echo "registry=$NPM_REGISTRY"
            echo "//$NPM_REGISTRY_HOST/:_authToken=\${NODE_AUTH_TOKEN}"
          } > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          npm whoami
          if npm view "$NPM_PACKAGE@$NPM_VERSION" version >/dev/null 2>&1; then
            echo "$NPM_PACKAGE@$NPM_VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Install upstream dependencies
        working-directory: upstream-src
        run: |
          # pnpm 10.33 + nodeLinker:hoisted 存在并发 rename race（ERR_PNPM_ENOENT）；
          # 单核 + 单子进程安装并最多重试 3 次以规避偶发失败。
          for attempt in 1 2 3; do
            if taskset -c 0 pnpm install --frozen-lockfile --child-concurrency=1; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "pnpm install failed (attempt $attempt); retrying..." >&2
            sleep 5
          done

      - name: Build Agent CLI and runtime assets without SEA or Web
        working-directory: upstream-src
        run: pnpm build:sea:prepare

      - name: Stamp the mirror version in the Agent build
        working-directory: upstream-src
        env:
          NPM_VERSION: ${{ steps.target.outputs.npm_version }}
        run: |
          node --input-type=module -e 'import { buildCli } from "./apps/zcode-cli/packages/cli/scripts/build.mjs"; await buildCli({ version: process.env.NPM_VERSION, sourcemap: false })'

      - name: Package CLI-only npm and Release artifacts
        id: pack
        env:
          NPM_VERSION: ${{ steps.target.outputs.npm_version }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          NODE_MAJOR: ${{ steps.target.outputs.node_major }}
          REPOSITORY_URL: git+https://github.com/${{ github.repository }}.git
        run: |
          set -e
          rm -rf stage
          mkdir -p stage
          node scripts/package-cli-release.mjs \
            --source upstream-src \
            --output stage/zcode \
            --name "$NPM_PACKAGE" \
            --version "$NPM_VERSION" \
            --readme MIRROR.md \
            --registry "$NPM_REGISTRY" \
            --repository "$REPOSITORY_URL"
          RELEASE_TARBALL="zcode-cli-${RELEASE_VERSION}-node${NODE_MAJOR}.tar.gz"
          tar -czf "stage/$RELEASE_TARBALL" -C stage zcode
          (cd stage && shasum -a 256 "$RELEASE_TARBALL" > "$RELEASE_TARBALL.sha256")
          (cd stage/zcode && npm pack --json --pack-destination ..) > npm-pack.json
          NPM_TARBALL=$(node -e 'const p=require("./npm-pack.json"); if(p.length!==1) process.exit(1); process.stdout.write(p[0].filename)')
          test -f "stage/$NPM_TARBALL"
          {
            echo "tarball=$RELEASE_TARBALL"
            echo "npm_tarball=$NPM_TARBALL"
          } >> "$GITHUB_OUTPUT"

      - name: Install isolated PTY verification dependency
        run: |
          set -e
          VERIFY_ROOT="$RUNNER_TEMP/zcode-cli-verify-deps"
          mkdir -p "$VERIFY_ROOT"
          npm install --prefix "$VERIFY_ROOT" --no-save node-pty

      - name: Verify the exact npm tarball before publishing
        env:
          NPM_TARBALL: ${{ steps.pack.outputs.npm_tarball }}
          ZCODE_CLI_EXPECTED_VERSION: ${{ steps.target.outputs.npm_version }}
          ZCODE_CLI_VERIFY_ROOT: ${{ runner.temp }}/zcode-cli-verify-deps
          ZCODE_DATA_BASE_DIR: ${{ runner.temp }}/zcode-cli-npm-pack-smoke-data
        run: |
          set -e
          INSTALL_DIR="$RUNNER_TEMP/npm-pack-install-verify"
          rm -rf "$INSTALL_DIR"
          npm install --global --prefix "$INSTALL_DIR" --ignore-scripts "$GITHUB_WORKSPACE/stage/$NPM_TARBALL"
          mkdir -p "$RUNNER_TEMP/zcode-cli-smoke-home"
          HOME="$RUNNER_TEMP/zcode-cli-smoke-home" node scripts/verify-installed-tui.mjs "$INSTALL_DIR/bin/zcode"

      - name: Verify the Release tarball outside the repository
        env:
          ZCODE_CLI_EXPECTED_VERSION: ${{ steps.target.outputs.npm_version }}
          ZCODE_CLI_VERIFY_ROOT: ${{ runner.temp }}/zcode-cli-verify-deps
          ZCODE_DATA_BASE_DIR: ${{ runner.temp }}/zcode-cli-release-smoke-data
        run: |
          mkdir -p "$RUNNER_TEMP/zcode-cli-smoke-home"
          HOME="$RUNNER_TEMP/zcode-cli-smoke-home" node scripts/smoke-cli-distribution.mjs "stage/${{ steps.pack.outputs.tarball }}"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.version }}
          name: ZCode CLI ${{ steps.target.outputs.version }}
          body: |
            CLI-only 自动构建自上游 [zai-org/ZCode@${{ steps.target.outputs.sha }}](https://github.com/zai-org/ZCode/commit/${{ steps.target.outputs.sha }}).

            - 上游源码检出后不做修改
            - 包含 Agent CLI、TUI 和所需运行时，不包含桌面 GUI、Web/Server 或 `--web` 模式
            - 运行需要 Node.js，版本要求见 npm 包 `engines.node`

            **安装**：
            ```bash
            tar -xzf ${{ steps.pack.outputs.tarball }}
            cd zcode
            ./install.sh
            zcode --version
            ```

            **校验**：
            ```bash
            shasum -a 256 -c ${{ steps.pack.outputs.tarball }}.sha256
            ```
          files: |
            stage/${{ steps.pack.outputs.tarball }}
            stage/${{ steps.pack.outputs.tarball }}.sha256
          prerelease: ${{ contains(steps.target.outputs.version, 'nightly') }}

      - name: Publish the verified npm tarball with provenance
        if: '!inputs.skip_npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/zcode-npmrc
          NPM_TARBALL: ${{ steps.pack.outputs.npm_tarball }}
          NPM_VERSION: ${{ steps.target.outputs.npm_version }}
          NPM_CHANNEL: ${{ steps.target.outputs.npm_channel }}
          UPSTREAM_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -e
          # Bug 原因：不带 ./ 的 stage/name 会被 npm 当成 GitHub 仓库简写，而不是本地 tarball。
          npm publish "./stage/$NPM_TARBALL" --access public --tag "$NPM_CHANNEL" --provenance
          echo "$NPM_PACKAGE@$NPM_VERSION published with dist-tag $NPM_CHANNEL (upstream $UPSTREAM_SHA)"

      - name: Verify fresh installation from npm
        if: '!inputs.skip_npm'
        env:
          NPM_VERSION: ${{ steps.target.outputs.npm_version }}
          ZCODE_CLI_EXPECTED_VERSION: ${{ steps.target.outputs.npm_version }}
          ZCODE_CLI_VERIFY_ROOT: ${{ runner.temp }}/zcode-cli-verify-deps
          ZCODE_DATA_BASE_DIR: ${{ runner.temp }}/zcode-cli-registry-smoke-data
        run: |
          set -e
          sleep 120
          for attempt in $(seq 1 26); do
            if npm view "$NPM_PACKAGE@$NPM_VERSION" version >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 26 ]; then echo "Published version is not visible after 15 minutes." >&2; exit 1; fi
            sleep 30
          done
          INSTALL_DIR="$RUNNER_TEMP/npm-registry-install-verify"
          rm -rf "$INSTALL_DIR"
          npm install --global --prefix "$INSTALL_DIR" --ignore-scripts "$NPM_PACKAGE@$NPM_VERSION"
          mkdir -p "$RUNNER_TEMP/zcode-cli-smoke-home"
          HOME="$RUNNER_TEMP/zcode-cli-smoke-home" node scripts/verify-installed-tui.mjs "$INSTALL_DIR/bin/zcode"
          npm dist-tag ls "$NPM_PACKAGE"
          npm view "$NPM_PACKAGE@$NPM_VERSION" dist.tarball dist.integrity --json

  verify-npm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_npm != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install isolated PTY verification dependency
        run: |
          VERIFY_ROOT="$RUNNER_TEMP/zcode-cli-verify-deps"
          mkdir -p "$VERIFY_ROOT"
          npm install --prefix "$VERIFY_ROOT" --no-save node-pty

      - name: Resolve requested version or dist-tag
        id: version
        env:
          REQUESTED: ${{ inputs.verify_npm }}
        run: |
          set -e
          if [ "$REQUESTED" = "latest" ] || [ "$REQUESTED" = "nightly" ]; then
            VERSION=$(npm view "$NPM_PACKAGE@$REQUESTED" version)
          else
            VERSION="$REQUESTED"
          fi
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "Invalid npm version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for registry and verify fresh installation
        env:
          NPM_VERSION: ${{ steps.version.outputs.version }}
          ZCODE_CLI_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          ZCODE_CLI_VERIFY_ROOT: ${{ runner.temp }}/zcode-cli-verify-deps
          ZCODE_DATA_BASE_DIR: ${{ runner.temp }}/zcode-cli-recovery-smoke-data
        run: |
          set -e
          sleep 120
          for attempt in $(seq 1 26); do
            if npm view "$NPM_PACKAGE@$NPM_VERSION" version >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 26 ]; then echo "Published version is not visible after 15 minutes." >&2; exit 1; fi
            sleep 30
          done
          INSTALL_DIR="$RUNNER_TEMP/npm-install-verify"
          npm install --global --prefix "$INSTALL_DIR" --ignore-scripts "$NPM_PACKAGE@$NPM_VERSION"
          mkdir -p "$RUNNER_TEMP/zcode-cli-smoke-home"
          HOME="$RUNNER_TEMP/zcode-cli-smoke-home" node scripts/verify-installed-tui.mjs "$INSTALL_DIR/bin/zcode"
          npm dist-tag ls "$NPM_PACKAGE"
          npm view "$NPM_PACKAGE@$NPM_VERSION" dist.tarball dist.integrity --json
